[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moderashield"
version = "0.1.0"
description = "Official Python SDK for the ModeraShield moderation API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/moderashield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
